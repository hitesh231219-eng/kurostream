name: Build Android APK (.APK)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag to attach the compiled Android APK to'
        required: true
        default: 'v2.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK with Gradle & Android SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & build web bundle
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Init Capacitor Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename and prepare APK artifact
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-android/KuroStream-Debug-2.0.0.apk
          sha256sum dist-android/KuroStream-Debug-2.0.0.apk > dist-android/SHA256SUMS-android.txt

      - name: Upload APK to GitHub Release v2.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v2.0.0' }}
          files: |
            dist-android/KuroStream-Debug-2.0.0.apk
            dist-android/SHA256SUMS-android.txt
          token: ${{ secrets.GITHUB_TOKEN }}
          clobber: true
