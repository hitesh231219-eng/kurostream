name: Build Android APK (.APK)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag to attach the compiled Android APK to'
        required: true
        default: 'v2.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK with Gradle & Android SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & build web bundle
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" || true

      - name: Sync Capacitor Android Platform
        run: |
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename and prepare APK artifact
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-android/KuroStream-Debug-2.0.0.apk
          sha256sum dist-android/KuroStream-Debug-2.0.0.apk > dist-android/SHA256SUMS-android.txt
          ls -lh dist-android/

      - name: Upload APK to GoFile
        run: |
          python3 scripts/upload-gofile.py dist-android/KuroStream-Debug-2.0.0.apk

      - name: Upload GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroStream-Android-APK-v2.0.0
          path: |
            dist-android/KuroStream-Debug-2.0.0.apk
            dist-android/SHA256SUMS-android.txt
            dist-android/gofile_link.txt
          if-no-files-found: warn

      - name: Upload APK to GitHub Release v2.0.0
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v2.0.0' }}
          files: |
            dist-android/KuroStream-Debug-2.0.0.apk
            dist-android/SHA256SUMS-android.txt
            dist-android/gofile_link.txt
          token: ${{ secrets.GITHUB_TOKEN }}
          clobber: true
