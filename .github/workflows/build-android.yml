name: Build Android APK (.APK)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag to attach the compiled Android APK to'
        required: true
        default: 'v2.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & build web bundle
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" || true

      - name: Sync Capacitor Android Platform & Strip Windows Assets
        run: |
          node scripts/sync-android.mjs

      - name: Configure Production Release Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Missing Android production signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            exit 1
          fi
          KEYSTORE_FILE="${RUNNER_TEMP}/kurostream-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          keytool -list -storetype PKCS12 -keystore "$KEYSTORE_FILE" -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
          echo "Production keystore verified for alias: ${ANDROID_KEY_ALIAS}"

      - name: Build Android Release APK with Gradle
        working-directory: ./android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Release Hardening, Signing & Clean Assets
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK not produced at $APK_PATH"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" | sort -V | tail -n 1)

          echo "==> Verifying APK signature..."
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

          if "$APKSIGNER" verify --print-certs "$APK_PATH" | grep -qi "Android Debug"; then
            echo "::error::APK was signed with a Debug certificate!"
            exit 1
          fi

          echo "==> Verifying debuggable=false and allowBackup=false via aapt2..."
          BADGING=$("$AAPT2" dump badging "$APK_PATH")
          echo "$BADGING" | head -n 10
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "::error::Release APK still has application-debuggable enabled!"
            exit 1
          fi

          echo "==> Verifying no Windows assets remain inside APK..."
          if unzip -l "$APK_PATH" | grep -iE '(\.bat|\.ps1|\.iss|\.zip|kurostream\.ico|assets/public/windows/)'; then
            echo "::error::Unnecessary Windows assets found inside compiled APK!"
            exit 1
          fi

          echo "All Android Release APK security & cleanliness checks passed."

      - name: Clean Temporary Keystore File
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/kurostream-release.p12"

      - name: Rename and prepare Release APK artifact
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release.apk dist-android/KuroStream-Release-2.0.0.apk
          sha256sum dist-android/KuroStream-Release-2.0.0.apk > dist-android/SHA256SUMS-android.txt
          ls -lh dist-android/

      - name: Upload Release APK to GoFile
        run: |
          python3 scripts/upload-gofile.py dist-android/KuroStream-Release-2.0.0.apk

      - name: Upload GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuroStream-Android-Release-APK-v2.0.0
          path: |
            dist-android/KuroStream-Release-2.0.0.apk
            dist-android/SHA256SUMS-android.txt
            dist-android/gofile_link.txt
          if-no-files-found: warn

      - name: Upload Release APK to GitHub Release v2.0.0
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v2.0.0' }}
          files: |
            dist-android/KuroStream-Release-2.0.0.apk
            dist-android/SHA256SUMS-android.txt
            dist-android/gofile_link.txt
          token: ${{ secrets.GITHUB_TOKEN }}
          clobber: true
